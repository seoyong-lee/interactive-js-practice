<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 전파와 위임</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>이벤트 전파와 위임</h1>

        <div class="layout">
            <section>
                <h2>1. 버블링 관찰하기</h2>
                <div id="outer" class="box">outer
                    <div id="middle" class="box">middle
                        <div id="inner" class="box">inner</div>
                    </div>
                </div>
                <label class="option">
                    <input id="stop-check" type="checkbox"> inner에서 전파 멈추기 (stopPropagation)
                </label>
            </section>

            <section>
                <h2>2. 이벤트 위임: 장보기 목록</h2>
                <div class="form">
                    <input id="item-input" type="text" placeholder="살 물건을 입력하세요">
                    <button id="btn-add">추가</button>
                </div>
                <ul id="shopping-list">
                    <li><span class="text">우유</span><button class="delete">삭제</button></li>
                    <li><span class="text">계란</span><button class="delete">삭제</button></li>
                    <li><span class="text">사과</span><button class="delete">삭제</button></li>
                </ul>
                <p class="hint">항목을 클릭하면 완료 표시, 삭제 버튼을 누르면 삭제돼요.</p>
            </section>
        </div>
    </div>
</body>
</html>
