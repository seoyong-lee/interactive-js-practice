<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코드잇 산성비</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>코드잇 산성비 ☔</h1>

        <div class="board">
            <span>점수 <strong id="score">0</strong></span>
            <span id="lives">❤️❤️❤️</span>
        </div>

        <div id="sky" class="sky">
            <p id="overlay" class="overlay">시작 버튼을 눌러 주세요</p>
            <div class="ground"></div>
        </div>

        <div class="controls">
            <input id="answer" type="text" placeholder="떨어지는 단어를 입력하고 Enter!" autocomplete="off">
            <button id="btn-start">시작</button>
        </div>
    </div>
</body>
</html>
