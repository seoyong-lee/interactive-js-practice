<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동적 리스트 만들기</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>오늘 할 일</h1>

        <div class="form">
            <input id="todo-input" type="text" placeholder="할 일을 입력하세요">
            <button id="btn-add">추가</button>
        </div>

        <ul id="todo-list"></ul>

        <p class="count">총 <span id="count">0</span>개</p>
    </div>
</body>
</html>
