<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>똑Talk한 Enter키!</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="chat">
        <header class="chat-header">💬 코드잇 스터디방</header>

        <ul id="messages" class="messages">
            <li class="bubble friend">오늘 실습 다 했어? 😎</li>
        </ul>

        <div class="chat-input">
            <textarea id="message" rows="2" placeholder="메시지를 입력하세요"></textarea>
            <button id="btn-send">전송</button>
        </div>
        <p class="hint">Enter 전송 · Shift + Enter 줄바꿈</p>
    </div>
</body>
</html>
